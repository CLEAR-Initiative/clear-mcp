"""One month in a MAU time series."""
type MauPoint {
  """ISO month (YYYY-MM, UTC)."""
  month: String!

  """
  Number of distinct users who logged in at least once during the
  calendar month.
  """
  uniqueUsers: Int!
}

type Mutation {
  """
  Accept an invitation. Creates user account if new, adds to org and team.
  """
  acceptInvite(input: AcceptInviteInput!): Boolean!

  """Add a comment to a signal or event."""
  addComment(input: AddCommentInput!): UserComment!

  """
  Append S3 keys to a crisis's attachments list. Idempotent — keys
  already present in the list are skipped silently. Returns the updated
  crisis with the new list. Any approved user (admin, analyst or
  viewer); a `pending` signup or the `worker` role is FORBIDDEN.
  """
  addCrisisAttachments(id: String!, keys: [String!]!): Crisis!

  """
  Add an existing event to an existing crisis. Idempotent - returns the existing link if one already exists.
  """
  addEventToCrisis(crisisId: String!, eventId: String!): EventCrisis!

  """Add feedback (rating + optional text) to a signal or event."""
  addFeedback(input: AddFeedbackInput!): UserFeedback!

  """Add a member to an organisation."""
  addOrgMember(orgId: String!, role: OrgMemberRole, userId: String!): OrgMember!

  """Add a member to a team."""
  addTeamMember(role: TeamMemberRole, teamId: String!, userId: String!): TeamMember!

  """
  Approve a self-signed-up user. Flips their role from `pending`
  to `viewer` (granting read access to signals / events / alerts /
  crises) and moves their CRM contact from the prospects collection
  into the approved collection — which fires Exponential's welcome
  automation. The local role flip is authoritative; CRM updates are
  best-effort and surface as fields on the result so the admin UI
  can offer a retry. Requires global `admin`.
  """
  approveUser(userId: String!): ApproveUserResult!

  """
  Archive published alerts whose event.lastSignalCreatedAt is older than
  olderThanDays (default: 14). Sets alerts.status to 'archived'. Admin or
  pipeline only. Returns the number of rows affected.
  """
  archiveStaleAlerts(olderThanDays: Int): ArchiveStaleAlertsResult!

  """Cancel a pending invitation."""
  cancelInvite(id: String!): Boolean!

  """
  Cancel a Task. The requester or a platform admin only. A PENDING
  Task is CANCELLED at once; a LEASED one is flagged and becomes
  CANCELLED at the Worker's next heartbeat, completion or failure (its
  result is discarded). Any other status is CONFLICT.
  """
  cancelTask(id: String!): Task!

  """
  WORKER CONTRACT (`worker` role): lease up to `limit` of the
  oldest claimable Tasks of exactly `kind` — PENDING, or LEASED past
  their expiry — atomically (`FOR UPDATE SKIP LOCKED`), so no two
  Workers hold the same Task. A Worker drains its own source kind
  (`event.impact_prior.clear`, `event.impact_prior.web`, …); the bare
  `event.impact_prior` stays claimable for one release. `limit` is
  clamped to the platform cap. Each lease lasts TASK_LEASE_MINUTES;
  heartbeat to keep it.
  """
  claimTasks(kind: String!, limit: Int = 1): [Task!]!

  """
  WORKER CONTRACT: report the Task done. `result` is the raw output
  (audit only). For an `event.impact_prior.*` Task, pass `impactPrior`
  to record a proposal (outcome `produced`; its `sourceKind` is the
  Task's kind, and it supersedes only the newest proposal of that same
  kind) or omit it to record `no_prior_found`. For an
  `event.impact_prior.web` Task, pass `cases` and `methodVersion`
  instead (V4): one CaseProposal per case, each decided on its own; a URL
  already proposed for the Event is skipped; an empty list records
  `no_prior_found`. The web cases inside an `impactPrior`'s
  `basis` become CaseProposals too. Only the lease owner,
  only while LEASED (CONFLICT
  `NOT_LEASED`, FORBIDDEN `NOT_LEASE_OWNER`). If cancellation was
  requested meanwhile the Task becomes CANCELLED and the result is
  discarded.
  """
  completeTask(
    cases: [CaseProposalInput!]
    id: String!
    impactPrior: ImpactPriorInput
    leaseToken: String!

    """Skill or handler version that produced `cases`; required with them."""
    methodVersion: String
    result: JSON!
    usage: TaskUsageInput
  ): Task!

  """Create an alert from an event, notifying subscribers."""
