  stock: Float!

  """
  T₀ - the anchor stock's reference date. Flows at/before it are treated
  as already counted inside `stock`.
  """
  t0: DateTime!

  """`stock` + `flowsSince` - the headline estimated current total."""
  total: Float!
}

