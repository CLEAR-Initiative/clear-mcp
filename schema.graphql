"""
Arbitrary JSON value — objects, arrays, strings, numbers, booleans, or null.
"""
scalar JSON

"""
One chunk written into the knowledgebase table. Mirrors the
columns exactly (minus `lexicalTsv`, which the DB trigger fills
from `embeddedText`, and `createdAt` which uses the column
default).
"""
input KnowledgebaseChunkInput {
  """0-indexed position within the report."""
  chunkIndex: Int!

  """Raw excerpt text — what a UI would render on a search hit."""
  chunkText: String!

  """
  LLM-generated context prefix (empty string when contextualization
  is skipped).
  """
  contextPrefix: String!

  """
  `contextPrefix + "\n\n" + chunkText` — what was actually
  embedded and tokenised.
  """
  embeddedText: String!

  """
  1024-dim dense embedding. The API validates length and casts to
  `vector(1024)` before insert.
  """
  embedding: [Float!]!
  embeddingModel: String!

  """
  Provenance for the embedding — mirrors the DB columns so a
  later re-embed backfill can filter by (provider, model).
  """
  embeddingProvider: String!

  """Multi-hazard tags — GLIDE codes or free-text categories."""
  eventTypes: [String!]!
  figureKind: String

  """
  Infographic capture: set only when this chunk is a figure
  transcription merged into the KB. `figureS3Key` is the cropped
  image's S3 key (join key to `report_figures`); `figureKind` is
  that figure's kind. Both null for ordinary text chunks.
  """
  figureS3Key: String

  """Resolved `locations.id` refs (post-lookup)."""
  locationIds: [String!]!

  """Raw pcodes the LLM emitted but the resolver couldn't match."""
  locationPcodes: [String!]!

  """
  NRC SAF sectors: Shelter, WASH, Protection, Health,
  Food Security, Education.
  """
  needSectors: [String!]!
  pageEnd: Int!

  """Inclusive PDF page span this chunk covers."""
  pageStart: Int!
  timeRangeEnd: DateTime

  """Optional event window described by the chunk."""
  timeRangeStart: DateTime
}

"""
Optional filters applied BEFORE the retrieval step — array
filters use overlap semantics (any-of), the time range uses
inclusive intersection. Leave a field null to skip that filter.
"""
input KnowledgebaseFilters {
  """
  Scope to one country: keep only chunks tagged with a location in this
  A0's subtree (itself or any descendant admin unit). Chunk locations are
  resolved to leaf admin ids, so a bare `locationIds=[A0]` would miss them —
  this expands the A0 to its subtree server-side via the locations tree. The
  situation-analysis RAG uses this so a country's analysis never cites reports
  about another country.
  """
  countryLocationId: String

  """
  Restrict to rows written by the currently-configured
  embedding provider + model. Default true — mixing embedding
  spaces yields meaningless distances. Set false only when
  inspecting historical rows via BM25-only search (no vector
  step will be run for filtered-out rows).
  """
  currentEmbeddingModelOnly: Boolean = true

  """Match rows tagged with ANY of these event-type tags."""
  eventTypes: [String!]

  """Match rows tagged with ANY of these `locations.id` values."""
  locationIds: [String!]

  """Match rows tagged with ANY of these SAF sectors."""
  needSectors: [String!]

  """Match rows whose extracted event window overlaps this range."""
  timeRange: DateRangeInput
}

"""
One hit from `searchKnowledgebase`. Carries enough source
provenance (report title, url, page range) that a UI can render a
citation without a follow-up fetch, plus the parameter arrays so
the caller can highlight which filters matched.
"""
type KnowledgebaseHit {
  chunkText: String!
  eventTypes: [String!]!
  figureKind: String

  """
  When this hit is a figure transcription, the cropped image's S3 key
  and its kind (chart/map/table/infographic/photo) — null for text hits.
  A consumer generating an infographic fetches this image and attaches it
  to the LLM call; plain Q&A ignores it. Kept as a lightweight REFERENCE
  (no bytes) so retrieval never pays S3 cost.
  """
  figureS3Key: String
  id: String!
  locationIds: [String!]!
  needSectors: [String!]!
  pageEnd: Int!
  pageStart: Int!
  publishedAt: DateTime
  reportId: String!
  reportTitle: String!

  """
  RRF-fused score. Larger is better. Not directly comparable
  across queries — the constant `k=60` bounds each per-row term
  to 1/(k+1)=~0.016, so a two-source hit tops out near 0.032.
  """
  score: Float!
  sourceUrl: String!
}

"""
One Dagster run kicked off by `uploadKnowledgebaseDocument`.
Returned by both the mutation (initial launch) and the polling
query. `reportId` / `reportTitle` / `s3Key` are populated from
the run's Dagster tags, which the mutation attaches at launch time —
a client that lost track of the initial payload can still recover
the identity of the document being ingested.
"""
type KnowledgebaseIngestJob {
  endedAt: DateTime

  """
  The knowledgebase report_id the ingest is targeting. Same value
  surfaces on `Knowledgebase.reportId` once the run succeeds.
  """
  reportId: String
  reportTitle: String

  """
  Opaque Dagster run id. Pass to `knowledgebaseIngestJob` to
  poll for completion.
  """
  runId: String!
  s3Key: String
  startedAt: DateTime
  status: KnowledgebaseIngestStatus!
}

"""
Coarse-grained status of a manual-ingest Dagster run. Dagster's
own RunStatus enum is finer-grained (STARTING / MANAGED / CANCELING
/ …) — we fold those down to what a UI actually needs to render.
"""
enum KnowledgebaseIngestStatus {
  CANCELED
  FAILURE
  QUEUED
  STARTED
  SUCCESS

  """
  Dagster is offline, the run id doesn't exist, or the run status
  is one this API doesn't recognise. Non-terminal — poll again.
  """
  UNKNOWN
}

"""
Per-locale payload accepted by upsertTranslations. data mirrors the
canonical entity's JSON shape exactly for the given locale — e.g. for
a crisis it carries the localized title/summary/scenarios/needs with
the same keys/nesting the English columns use.
"""
input LocaleTranslationInput {
  """Translated payload. Shape mirrors the canonical entity per type."""
  data: JSON!

  """BCP-47 lowercased — 'ar', 'fr'. 'en' is rejected (canonical)."""
  locale: String!

  """
  Per-field SHA-256 hashes of the canonical English source used to produce `data`. Stored so the pipeline can detect which canonical field changed and re-translate only that field on the next pass.
  """
  sourceHashes: JSON!
}

"""A geographic location in a hierarchy (country > state > city, etc.)."""
type Location {
  """IDs of all ancestor locations (parent, grandparent, etc.)."""
  ancestorIds: [String!]!

  """All ancestor locations (parent, grandparent, etc.)."""
  ancestors: [Location!]!

  """Child locations one level below."""
  children: [Location!]!

  """When the row was first created."""
  createdAt: DateTime!

  """GeoNames identifier."""
  geoId: Int

  """Geometry as GeoJSON (Point or MultiPolygon)."""
  geometry: GeoJSON
  id: String!

  """Hierarchy level: 0 = country, 1 = state/province, 2 = city, etc."""
  level: Int!

  """
  Per-type metadata (IOM DTM, INFORM, etc). Pass a type argument to filter.
  By default only the current value is returned (validTo is null).
  Pass current: false to include the full history.
  """
  metadata(current: Boolean, type: String): [LocationMetadata!]!
  name: String!

  """OpenStreetMap identifier."""
  osmId: String

  """P-Code identifier."""
  pCode: String

  """Parent location in the hierarchy."""
  parent: Location

  """
  Provenance of this location's geometry. Notable values:
  - 'landmark-geocoded': L4 created by the pipeline geoparser from a
    landmark/place name resolved via Nominatim. The location's `name`
    field is meaningful for display (e.g., 'Nyala Airport').
  - 'gps' / 'source-gps' / 'centroid' / 'source-centroid': see schema
    documentation on the Prisma model.
  - null: legacy rows (most signal-title L4s from `createPointLocation`).
  """
  pointType: String

  """
  Population residing within this location's geometry. Null for point locations or when not yet computed.
  """
  population: String

  """Last write — useful for tracking admin polygon (re-)loads."""
  updatedAt: DateTime!
}

"""
Arbitrary per-location metadata keyed by type. History is preserved:
writes close the current row (set validTo = now()) and insert a new one.
The CURRENT value for a (location, type) is the row where validTo is null.
"""
type LocationMetadata {
  createdAt: DateTime!

  """Source-specific payload stored as JSON."""
  data: JSON!
  id: String!
  location: Location!

  """Free-form type string (e.g. "iom_dtm_displacement", "acaps_inform")."""
  type: String!
  updatedAt: DateTime!

  """When this value became current."""
  validFrom: DateTime!

  """When this value was superseded. Null means still current."""
  validTo: DateTime
}

"""One month in a MAU time series."""
type MauPoint {
  """ISO month (YYYY-MM, UTC)."""
  month: String!

  """
  Number of distinct users who logged in at least once during the
  calendar month.
  """
  uniqueUsers: Int!
}

type Mutation {
  """
  Accept an invitation. Creates user account if new, adds to org and team.
  """
  acceptInvite(input: AcceptInviteInput!): Boolean!

  """Add a comment to a signal or event."""
  addComment(input: AddCommentInput!): UserComment!

  """
  Append S3 keys to a crisis's attachments list. Idempotent — keys
  already present in the list are skipped silently. Returns the updated
  crisis with the new list.
  """
  addCrisisAttachments(id: String!, keys: [String!]!): Crisis!

  """
  Add an existing event to an existing crisis. Idempotent - returns the existing link if one already exists.
  """
  addEventToCrisis(crisisId: String!, eventId: String!): EventCrisis!

  """Add feedback (rating + optional text) to a signal or event."""
  addFeedback(input: AddFeedbackInput!): UserFeedback!

  """Add a member to an organisation."""
  addOrgMember(orgId: String!, role: OrgMemberRole, userId: String!): OrgMember!

  """Add a member to a team."""
  addTeamMember(role: TeamMemberRole, teamId: String!, userId: String!): TeamMember!

  """
  Approve a self-signed-up user. Flips their role from `pending`
  to `viewer` (granting read access to signals / events / alerts /
  crises) and moves their CRM contact from the prospects collection
  into the approved collection — which fires Exponential's welcome
  automation. The local role flip is authoritative; CRM updates are
  best-effort and surface as fields on the result so the admin UI
  can offer a retry. Requires global `admin`.
  """
  approveUser(userId: String!): ApproveUserResult!

  """
  Archive published alerts whose event.lastSignalCreatedAt is older than
  olderThanDays (default: 14). Sets alerts.status to 'archived'. Admin or
  pipeline only. Returns the number of rows affected.
  """
  archiveStaleAlerts(olderThanDays: Int): ArchiveStaleAlertsResult!

  """Cancel a pending invitation."""
  cancelInvite(id: String!): Boolean!

  """Create an alert from an event, notifying subscribers."""
