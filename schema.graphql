  """
  impactPriors(limit: Int = 50, offset: Int = 0, state: ImpactPriorState = proposed): [ImpactPrior!]!

  """Look up an invitation by token (public - used on accept-invite page)."""
  invitationByToken(token: String!): InvitationInfo

