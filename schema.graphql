  Dagster `process_manual_document_job` to run the extract →
  chunk → enrich → embed → upsert chain against it.
  
  The report_id is derived from the file's SHA-256 (first 12 chars,
  prefixed `manual:`) so re-uploading the same bytes is idempotent
  — Dagster runs but the upsert path replaces the previous version
  in place. To force a fresh row, tweak the file (any byte) or
  switch to a scripted upload that supplies its own report_id.
  
  Restricted to admin / analyst — the ingest costs LLM + embedding
  credits per document. When DAGSTER_URL is unset the mutation
  still stages the PDF in S3 but returns a UNKNOWN-status job with
  no runId — useful for offline dev of the upload path.
  """
  uploadKnowledgebaseDocument(file: Upload!, publishedAt: DateTime!, sourceUrl: String, title: String!): KnowledgebaseIngestJob!

  """
  Upsert a unified frame-scoped analysis (ADR-0007). The pipeline
  generator's write path: bitemporal supersede-then-insert keyed on the
  frame columns (locationIds / eventTypes / needSectors / windowStart /
  windowEnd), stamping `validTo` on the previous current row for the same
  frame in the same transaction. History rows are preserved. Frame arrays are
  canonicalised (sorted + de-duplicated) server-side. Admin / pipeline only.
  """
  upsertAnalysis(input: UpsertAnalysisInput!): UpsertAnalysisResult!

  """
  Create one of your Conversations with the CLEAR Agent's thread id, or
  update its title or metadata. FORBIDDEN if the id belongs to another user.
  CLEAR Agent only (the owner's session plus the agent key).
  """
  upsertConversation(input: UpsertConversationInput!): Conversation!

  """
  Create or replace messages in one of your Conversations, matched by id
  (at most 200 per call). Only the owner's Conversations, admins included,
  and CLEAR Agent only (the owner's session plus the agent key). An Answer
  whose usage is recorded can't change. Returns the messages in input order.
  """
  upsertConversationMessages(conversationId: String!, messages: [ConversationMessageInput!]!): [ConversationMessage!]!

  """
  PIPELINE CONTRACT (admin/pipeline only): write back
  classifications from the classify_ground_messages worker. Unknown
  messageIds are skipped with a warning. Returns the number of
  messages updated.
  """
  upsertGroundMessageClassifications(inputs: [GroundMessageClassificationInput!]!): Int!

  """
  PIPELINE CONTRACT (admin/pipeline only): write back transcriptions
  from the ground_transcribe worker. Unknown messageIds are skipped
  with a warning. Returns the number of messages updated.
  """
  upsertGroundMessageTranscripts(inputs: [GroundMessageTranscriptInput!]!): Int!

  """
  PIPELINE CONTRACT (admin/pipeline only): write back enrichment
  drafts (title/severity/location/disasterType) from the hotline
  enrichment job. Unknown threadIds are skipped with a warning. Null
  fields on an input leave the existing draft value unchanged. Returns
  the number of threads updated.
  """
  upsertGroundThreadDrafts(inputs: [GroundThreadDraftInput!]!): Int!

  """
  PIPELINE CONTRACT (admin/pipeline only): replace placeholder
  threading with pipeline-built threads (clusters of staged
  Signals). Each input creates a
  thread (or, when `threadId` is set, APPENDS to that existing
  thread and updates its lifecycleState + title), re-points its
  messageIds at it, and deletes the placeholder threads that became
  empty. Messages whose current thread has already been human-reviewed
  (or promoted) are NEVER re-threaded, and a promoted `threadId`
  target is never mutated (a new thread is created instead) — the
  review gate outranks the pipeline. Returns one thread id per input,
  in order; null where an input had no movable messages (no thread
  created or updated).
  """
  upsertGroundThreads(inputs: [GroundThreadUpsertInput!]!): [String]!

  """
  Replace all knowledgebase rows for `reportId` with `chunks`.
  Runs inside one transaction — a failed insert rolls back the
  delete so a re-run can retry cleanly. Vector length is validated
  against the pgvector column dimension (1024) on the server;
  mismatched rows are rejected before the write hits Postgres.
  Admin/pipeline only.
  """
  upsertKnowledgebaseChunks(chunks: [KnowledgebaseChunkInput!]!, publishedAt: DateTime!, reportId: String!, reportTitle: String!, s3Key: String!, sourceUrl: String!): UpsertKnowledgebaseResult!

  """
  Create or update a location's metadata entry for a given type (admin/pipeline only).
  Upsert keyed by (locationId, type).
  """
  upsertLocationMetadata(input: UpsertLocationMetadataInput!): LocationMetadata!

  """
  Bulk-upsert multiple (locationId, type, data) rows in a single call (admin/pipeline only).
  Returns the current row for each input. Rows whose locationId doesn't exist are
  skipped silently. Idempotent: an input whose blob is identical to the currently-open
  row is left untouched (no new history version), so re-running an ingest with unchanged
  data is a no-op.
  """
  upsertLocationMetadataBatch(inputs: [UpsertLocationMetadataInput!]!): [LocationMetadata!]!

  """
  Upsert a Nominatim geocoder cache entry (admin/pipeline only).
  Replaces any existing row with the same queryHash, resetting the TTL.
  """
  upsertNominatimCache(input: UpsertNominatimCacheInput!): NominatimCacheEntry!

  """
  Replace the `report_datapoints` row for `input.reportId`.
  Admin / pipeline only. The dagster-quickstart datapoints
  extraction asset is the primary caller; hand-invocation is
  supported for backfills and re-extraction. Idempotent — the row
  is uniquely keyed on `report_id`.
  """
  upsertReportDatapoints(input: UpsertReportDatapointsInput!): UpsertReportDatapointsResult!

  """
  Replace a report's captured infographics (image asset store). Pipeline-only;
  delete-then-insert like `upsertReportDatapoints`.
  """
  upsertReportFigures(input: UpsertReportFiguresInput!): UpsertReportFiguresResult!

  """
  Insert a fresh situation-analysis snapshot for
  (`input.countryLocationId`, `input.windowStart`,
  `input.windowEnd`) and stamp `validTo = now()` on the
  previous current row for the same bucket in the same
  transaction. History rows are preserved. Admin / pipeline only —
  the Dagster `weekly_situation_analyses` asset is the primary
  caller.
  """
  upsertSituationAnalysis(input: UpsertSituationAnalysisInput!): UpsertSituationAnalysisResult!

  """
  Upsert one or more per-locale translation rows for an event,
  crisis, or location. The translated data blob mirrors the canonical
  entity's JSON shape per locale. Admin/pipeline only. Clears any matching
  rows from the translation queue (the write is the drain-completion signal).
  """
  upsertTranslations(input: UpsertTranslationsInput!): UpsertTranslationsResult!

  """Verify email using a token from the verification link."""
  verifyEmail(token: String!): Boolean!
}

"""A cached Nominatim-protocol geocoder response."""
type NominatimCacheEntry {
  """
  The Nominatim endpoint that produced this response (e.g. 'search', 'reverse').
  """
  endpoint: String!
  expiresAt: DateTime!
  fetchedAt: DateTime!
  id: String!

  """Raw query string (for debugging only)."""
  query: String!

  """SHA-256 hex digest of `<endpoint>:<normalised_query>`."""
  queryHash: String!

  """Raw JSON response from the geocoder."""
  responseJson: JSON!

  """Lookup outcome: 'ok' / 'no_result' / 'error'."""
  status: String!
}

