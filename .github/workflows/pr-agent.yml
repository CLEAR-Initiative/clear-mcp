name: PR Agent

# Qodo PR-Agent automated review, wired to Anthropic Claude. Mirrors clear-api's
# workflow; runs from the copy of this file on the PR's BASE branch (main).
#
# Manual step (one-time): the repo secret PR_AGENT_ANTHROPIC_KEY must exist, e.g.
#   gh secret set PR_AGENT_ANTHROPIC_KEY --repo CLEAR-Initiative/clear-mcp
# Until it is set, the auth step fails (litellm AuthenticationError). No
# OPENAI_API_KEY is required — config.fallback_models points at another
# Anthropic model to stop PR-Agent initialising an OpenAI client.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Loop guard: ignore events triggered by bots (incl. PR-Agent itself).
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.PR_AGENT_ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-4-6"
          config.fallback_models: '["anthropic/claude-sonnet-4-6"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
