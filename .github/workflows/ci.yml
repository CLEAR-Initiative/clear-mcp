name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The built binary must run under Node 20+ as well as Bun (npx path).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      # Generated types must match schema.graphql + the committed documents.
      - name: Generated GraphQL types are in sync
        run: bun run codegen && git diff --exit-code src/gql

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

      # Smoke the Node build: a missing env var must exit 1 naming it on stderr.
      - name: Built binary runs on Node
        run: |
          set +e
          out=$(node dist/bin.js 2>&1 </dev/null); code=$?
          set -e
          echo "$out"
          test "$code" = "1" && echo "$out" | grep -q CLEAR_API_KEY

      # The Tool library entry (ADR-0009), resolved through package.json `exports`
      # by the package's own name — as a Consumer imports it — under Node 20.
      - name: Tool library imports on Node
        run: |
          node --input-type=module -e "
          const lib = await import('@clear-initiative/mcp/library');
          for (const name of ['curatedTools', 'runTool', 'createUpstream', 'createLocationIndex']) {
            if (typeof lib[name] !== 'function') throw new Error(name + ' is not exported');
          }
          const tools = lib.curatedTools({ locationIndex: lib.createLocationIndex() });
          if (tools.length !== 15) throw new Error('expected 15 curated tools, got ' + tools.length);
          console.log('library ok:', tools.length, 'tools');
          "

      # The Claude Desktop extension: stage dist/ with production dependencies,
      # smoke-run it under Node, pack it. Uploaded so a PR's .mcpb can be tried
      # in Claude Desktop before it is released.
      - name: Build the Claude Desktop extension
        run: bun scripts/build-mcpb.ts
      - uses: actions/upload-artifact@v4
        with:
          name: clear-mcp-mcpb
          path: build/*.mcpb
          retention-days: 14
